server:
  port: ${PORT}

spring:
  application:
    name: ms-users

adapters:
  db:
    host: ${DB_HOST}
    port: ${DB_PORT}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    database: ${DB_NAME}

logging:
  level:
    com:
      foodcourt: ${LOG_LEVEL}
    org:
      hibernate:
        orm:
          connections:
            pooling: ERROR